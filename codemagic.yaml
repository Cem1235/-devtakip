workflows:
  ios-ipa-workflow:
    name: iOS Unsigned IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned app
        script: |
          xcodebuild build \
            -project "OdevTakip.xcodeproj" \
            -scheme "OdevTakip" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derived_data \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA for Sideloadly
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/derived_data/Build/Products/Release-iphoneos/OdevTakip.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r OdevTakip.ipa Payload
          rm -rf Payload
    artifacts:
      - build/ios/ipa/*.ipa
